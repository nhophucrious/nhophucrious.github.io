{{ define "main" }}
<section class="page-section container">

    <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="/">Home</a>
        <span class="breadcrumb-separator">/</span>
        <span class="breadcrumb-current">{{ .Title }}</span>
    </nav>

    <h1 class="page-title">{{ .Title }}</h1>

    <div class="listing-grid" data-stagger>
        {{ range .Pages }}
            <a href="{{ .RelPermalink }}" class="listing-card reveal">
                {{ if .Params.thumbnail }}
                <img src="{{ .Params.thumbnail | relURL }}" alt="" class="listing-thumbnail" loading="lazy">
                {{ end }}
                <div class="listing-content">
                    {{ with .Date }}<p class="meta">{{ .Format "Jan 2006" }}</p>{{ end }}
                    <h2>{{ .Title }}</h2>
                    {{ with .Params.summary }}<p class="listing-summary">{{ . }}</p>{{ end }}
                </div>
            </a>
        {{ else }}
            <p class="empty-note">It's coming soon!</p>
        {{ end }}
    </div>

</section>
{{ end }}
